[Unit]
# A cache may be incomplete or contain paths from a previous enumeration.
ConditionFileNotEmpty=
After=systemd-modules-load.service systemd-remount-fs.service

[Service]
# -s bypasses libblkid (old MD signatures can hide valid ZFS labels).
# Search persistent IDs first; /dev also covers disks without an ID symlink.
Environment=ZPOOL_IMPORT_PATH=/dev/disk/by-id:/dev
ExecStart=
ExecStart=/usr/sbin/zpool import -aN -s -o cachefile=none
