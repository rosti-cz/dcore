name: Build Debian bootc image

on:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      bootc_ref: ${{ steps.config.outputs.bootc_ref }}
      incus_channel: ${{ steps.config.outputs.incus_channel }}
    steps:
      - uses: actions/checkout@v7
      - name: Test installer filesystem selection and disk safeguards
        run: |
          sudo modprobe loop
          sudo python3 tests/test-installers.py
          python3 tests/test-incus-install.py
          sudo python3 tests/test-encrypted-install.py
          python3 tests/test-grow-root-cmdline.py
      - id: config
        name: Read Debian release configuration
        run: |
          python3 - <<'PYCONFIG'
          import json, os, re
          config = json.load(open('build-config.json'))
          assert config['stable_release'] in config['releases']
          assert len(config['releases']) == len(set(config['releases']))
          for release in config['releases']:
              assert re.fullmatch(r'[a-z][a-z0-9-]*', release), release
          assert re.fullmatch(r'[A-Za-z0-9._/-]+', config['bootc_ref'])
          assert config['incus_channel'] in ('stable', 'lts-6.0', 'lts-7.0', 'daily')
          matrix = {'include': [{'release': r, 'floating': r == config['stable_release']} for r in config['releases']]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(matrix) + '\n')
              out.write('bootc_ref=' + config['bootc_ref'] + '\n')
              out.write('incus_channel=' + config['incus_channel'] + '\n')
          PYCONFIG

  build:
    needs: configure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    env:
      DEBIAN_RELEASE: ${{ matrix.release }}
      FLOATING_TAGS: ${{ matrix.floating }}
      BOOTC_REF: ${{ needs.configure.outputs.bootc_ref }}
      INCUS_CHANNEL: ${{ needs.configure.outputs.incus_channel }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          sudo podman build --pull=always --format=oci \
            --build-arg "DEBIAN_RELEASE=$DEBIAN_RELEASE" \
            --build-arg "BOOTC_REF=$BOOTC_REF" \
            --build-arg "INCUS_CHANNEL=$INCUS_CHANNEL" \
            --build-arg "IMAGE_SOURCE=https://github.com/$REPOSITORY" \
            --build-arg "IMAGE_REVISION=$GITHUB_SHA" \
            --tag "$IMAGE:$DEBIAN_RELEASE" --file Containerfile .
          sudo podman run --rm "$IMAGE:$DEBIAN_RELEASE" /usr/libexec/dcore/verify-image
      - name: Test user, Homebrew and shell environment
        run: |
          sudo podman run --rm --network=none --security-opt label=disable \
            -v "$GITHUB_WORKSPACE/tests:/tests:ro" \
            "$IMAGE:$DEBIAN_RELEASE" /tests/test-user-environment.sh
      - name: Test root partition and filesystem growth
        run: |
          sudo modprobe loop
          sudo modprobe btrfs
          sudo modprobe xfs
          sudo modprobe dm_crypt
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /dev:/dev -v "$GITHUB_WORKSPACE/tests:/tests:ro" \
            "$IMAGE:$DEBIAN_RELEASE" /tests/test-grow-root.sh
      - name: Publish to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'sudo podman logout ghcr.io' EXIT
          sudo podman push "$IMAGE:$DEBIAN_RELEASE"
          if [[ "$FLOATING_TAGS" == true ]]; then
            for tag in stable latest; do
              sudo podman tag "$IMAGE:$DEBIAN_RELEASE" "$IMAGE:$tag"
              sudo podman push "$IMAGE:$tag"
            done
          fi
