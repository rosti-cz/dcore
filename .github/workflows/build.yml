name: Build Debian bootc image

on:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      bootc_ref: ${{ steps.config.outputs.bootc_ref }}
      incus_channel: ${{ steps.config.outputs.incus_channel }}
    steps:
      - uses: actions/checkout@v7
      - name: Test installer filesystem selection and disk safeguards
        run: |
          sudo modprobe loop
          sudo python3 tests/test-installers.py
          python3 tests/test-incus-install.py
          sudo python3 tests/test-encrypted-install.py
          python3 tests/test-offline-installer.py
          python3 tests/test-grow-root-cmdline.py
          python3 tests/test-admin.py
          python3 tests/test-secureboot.py
      - name: Test offline image RAM staging
        run: sudo python3 tests/test-image-staging.py
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.9
          cache-dependency-path: installer/go.sum
      - name: Test Go installer, web authentication, and recovery
        run: |
          cd installer
          go test -race ./...
          go vet ./...
      - name: Test privileged installer and first-boot networking
        run: |
          python3 tests/test-host-installer.py
          python3 tests/test-finish-install.py
          python3 tests/test-network-bootstrap.py
          python3 tests/test-hostid.py
      - id: config
        name: Read Debian release configuration
        run: |
          python3 - <<'PYCONFIG'
          import json, os, re
          config = json.load(open('build-config.json'))
          assert config['stable_release'] in config['releases']
          assert len(config['releases']) == len(set(config['releases']))
          for release in config['releases']:
              assert re.fullmatch(r'[a-z][a-z0-9-]*', release), release
          assert re.fullmatch(r'[A-Za-z0-9._/-]+', config['bootc_ref'])
          assert config['incus_channel'] in ('stable', 'lts-6.0', 'lts-7.0', 'daily')
          matrix = {'include': [{'release': r, 'floating': r == config['stable_release']} for r in config['releases']]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(matrix) + '\n')
              out.write('bootc_ref=' + config['bootc_ref'] + '\n')
              out.write('incus_channel=' + config['incus_channel'] + '\n')
          PYCONFIG

  build:
    needs: configure
    # Only default-branch builds use the persistent organization runner.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '["self-hosted", "linux", "x64", "dcore"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    env:
      DEBIAN_RELEASE: ${{ matrix.release }}
      FLOATING_TAGS: ${{ matrix.floating }}
      BOOTC_REF: ${{ needs.configure.outputs.bootc_ref }}
      INCUS_CHANNEL: ${{ needs.configure.outputs.incus_channel }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Secure Boot signing secret
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SECUREBOOT_SIGNING_KEY: ${{ secrets.SECUREBOOT_SIGNING_KEY }}
        run: python3 scripts/prepare-secureboot-secret.py
      - name: Build and verify image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          SIGNING_ARGS=(--build-arg SECUREBOOT_REQUIRED=0)
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            SIGNING_ARGS=(--secret "id=secureboot_key,src=$RUNNER_TEMP/dcore-secureboot.key")
          fi
          sudo podman build --pull=always --squash --format=oci "${SIGNING_ARGS[@]}" \
            --build-arg "DEBIAN_RELEASE=$DEBIAN_RELEASE" \
            --build-arg "BOOTC_REF=$BOOTC_REF" \
            --build-arg "INCUS_CHANNEL=$INCUS_CHANNEL" \
            --build-arg "IMAGE_SOURCE=https://github.com/$REPOSITORY" \
            --build-arg "IMAGE_REVISION=$GITHUB_SHA" \
            --tag "$IMAGE:$DEBIAN_RELEASE" --file Containerfile .
          sudo podman run --rm "$IMAGE:$DEBIAN_RELEASE" /usr/libexec/dcore/verify-image
      - name: Remove signing secret from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/dcore-secureboot.key"
      - name: Test user, Homebrew and shell environment
        run: |
          sudo podman run --rm --network=none --security-opt label=disable \
            -v "$GITHUB_WORKSPACE/tests:/tests:ro" \
            "$IMAGE:$DEBIAN_RELEASE" /tests/test-user-environment.sh
      - name: Test djust privilege boundaries
        run: |
          sudo podman run --rm --network=none --security-opt label=disable \
            -v "$GITHUB_WORKSPACE/tests:/tests:ro" \
            "$IMAGE:$DEBIAN_RELEASE" /tests/test-djust-privileges.sh
      - name: Test Secure Boot, encrypted installation and module enforcement
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3-virt-firmware
          sudo modprobe loop
          sudo modprobe btrfs
          sudo modprobe dm_crypt
          sudo python3 tests/test-secureboot-vm.py --image "$IMAGE:$DEBIAN_RELEASE" --filesystem btrfs --encrypt --check-installer
      - name: Test root partition and filesystem growth
        run: |
          sudo modprobe loop
          sudo modprobe btrfs
          sudo modprobe xfs
          sudo modprobe dm_crypt
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /dev:/dev -v "$GITHUB_WORKSPACE/tests:/tests:ro" \
            "$IMAGE:$DEBIAN_RELEASE" /tests/test-grow-root.sh
      - name: Publish to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'sudo podman logout ghcr.io' EXIT
          sudo podman push "$IMAGE:$DEBIAN_RELEASE"
          if [[ "$FLOATING_TAGS" == true ]]; then
            for tag in stable latest; do
              sudo podman tag "$IMAGE:$DEBIAN_RELEASE" "$IMAGE:$tag"
              sudo podman push "$IMAGE:$tag"
            done
          fi
